# -- Standard library: deprecations worth a specific fix -----------------------

[[api]]
name = "datetime.datetime.utcnow"
status = "deprecated"
version = "3.12"
message = "is deprecated (Python 3.12) and returns a naive datetime"
fix = "Use `datetime.now(timezone.utc)` (`from datetime import datetime, timezone`)."

[[api]]
name = "datetime.datetime.utcfromtimestamp"
status = "deprecated"
version = "3.12"
message = "is deprecated (Python 3.12) and returns a naive datetime"
fix = "Use `datetime.fromtimestamp(ts, tz=timezone.utc)`."

[[api]]
name = "asyncio.get_event_loop"
status = "deprecated"
version = "3.10"
message = "is deprecated (Python 3.10-3.12) when no loop is running"
fix = "Use `asyncio.run(main())` at the top level, or `asyncio.get_running_loop()` inside a coroutine."

[[api]]
name = "logging.warn"
status = "deprecated"
version = "3.3"
fix = "Use `logging.warning`."

[[api]]
name = "pkg_resources"
status = "deprecated"
package = "setuptools"
message = "is deprecated in setuptools; it is slow to import and scheduled for removal"
fix = "Use `importlib.metadata` (versions, entry points) or `importlib.resources` (data files)."

