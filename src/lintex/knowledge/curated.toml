status = "deprecated"
package = "pytest"
version = "6.2"
rewrite = "pytest.fixture"
fix = "Use `@pytest.fixture`; `yield` works there too."

[[api]]
name = "pytest.config"
status = "removed"
package = "pytest"
version = "5.0"
fix = "Use the `pytestconfig` fixture (or `request.config`)."

