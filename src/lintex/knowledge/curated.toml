[[api]]
name = "tensorflow.flags"
status = "removed"
package = "TensorFlow"
version = "2.0"
fix = "Use `absl.flags` or `argparse`."

[[api]]
name = "tensorflow.logging"
status = "removed"
package = "TensorFlow"
version = "2.0"
fix = "Use `absl.logging` or the standard `logging` module."

[[api]]
name = "tensorflow.get_variable"
status = "removed"
package = "TensorFlow"
version = "2.0"
