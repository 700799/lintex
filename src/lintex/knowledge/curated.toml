# Hand-curated API knowledge for LX101 (hallucinated-api).
#
# Each [[api]] is a dotted name an agent might produce from stale training data.
#   status  = "removed" | "deprecated" | "py2"
#   version = the Python (or package) version where it was removed/deprecated
#   package = distribution name for third-party APIs (default: "python")
#   fix     = what to write instead - specific, copy-pasteable, one or two lines
#   message = optional override for the "`name` <message>." predicate
#
# [[method]] entries match a bare method name on any receiver (`x.iteritems()`),
# so keep them to names that are wrong everywhere.
#
# [[family]] expands one fix template over many names.
#
# Stdlib module removals and @deprecated stubs are generated into typeshed.json
# by `python -m lintex.knowledge.sync`; add an entry here only to give a better
# fix than the generic one (curated entries override generated ones).

